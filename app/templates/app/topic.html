{% extends "app/base.html" %}

{% block content %}
    
    <h3>Topico: {{ topic }}</h3>

    <p>Entradas: </p>
    <ul>
        {% for entry in entries%}

        <li>
            <p>{{ entry.date_added | date:'m/d/Y'}}</p>
            <p>{{ entry.text | linebreaks }}</p>

        </li>

        {% empty %}

        <li>
            <p>Nao ha registro.</p>
        </li>

        {% endfor %}
    </ul>

{% endblock content%}
